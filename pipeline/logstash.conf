input {
  file {
    path => "/usr/share/logstash/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    # faster detection for live demo
    stat_interval => 1
    discover_interval => 1
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:level}\s+service=%{WORD:service}\s+env=%{WORD:env}\s+request_id=%{WORD:request_id}\s+message=\"%{GREEDYDATA:log_message}\"" }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ops-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
